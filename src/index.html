<!doctype html>
<html lang="en">

<head>
  <script>
    window.GLOBAL_CONFIG = {
      // PREFIX: "/dist/homer-ui/",
    };

    let base_href = '/';
    if (typeof window.GLOBAL_CONFIG == "object") {
      let config = window.GLOBAL_CONFIG;
      if (config.HOST && config.PREFIX) {
        base_href = config.HOST + config.PREFIX;
      } else if (config.PREFIX) {
        base_href = config.PREFIX;
      }
    }
    var newBase = document.createElement("base");
    newBase.setAttribute("href", base_href);
    document.getElementsByTagName("head")[0].appendChild(newBase);
  </script>
  <meta charset="utf-8">
  <title>HomerUi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; connect-src 'self' http: https: ws: wss:; frame-src 'self' http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="mat-typography">
  <app-root></app-root>
</body>

</html>
