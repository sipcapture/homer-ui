<!DOCTYPE html>
<html>

<head>
    <title>Upgrade...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- <META http-equiv="REFRESH" content="0;URL=/"> -->

    <script>
        function safeRedirectUrl(raw) {
            if (!raw || typeof raw !== 'string') {
                return '/';
            }
            var trimmed = raw.trim();
            if (trimmed.charAt(0) === '/' && trimmed.charAt(1) !== '/') {
                return trimmed;
            }
            try {
                var target = new URL(trimmed, location.origin);
                if (target.origin !== location.origin) {
                    return '/';
                }
                if (target.protocol !== 'http:' && target.protocol !== 'https:') {
                    return '/';
                }
                return target.pathname + target.search + target.hash;
            } catch (e) {
                return '/';
            }
        }

        function init() {
            var query = location.search.slice(1);
            var raw = '';
            var parts = query.split('URL=');
            if (parts.length > 1) {
                raw = decodeURIComponent(decodeURIComponent(parts[1]));
            }
            document.location.assign(safeRedirectUrl(raw));
        }
        init();
    </script>
</head>

<body onload="init()"></body>

</html>
